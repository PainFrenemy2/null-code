name: Build & Release

# Every push builds the app. Pushes to the project branch `null-monitor` (and manual runs)
# also publish a release tagged null-monitor-v1.0.N — the repo hosts one project per branch.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'install.ps1']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PROJECT: src/NullMonitor/NullMonitor.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Publish single-file exe
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          & $iscc /Qp "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\NullMonitor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item publish/NullMonitor.exe dist/NullMonitor-Portable.exe
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: NullMonitor-v${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Create GitHub release
        if: github.ref == 'refs/heads/null-monitor' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: null-monitor-v${{ steps.ver.outputs.version }}
          name: Null Monitor v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          make_latest: true
          body: |
            ## Null Monitor v${{ steps.ver.outputs.version }}

            Мониторинг ПК для Windows 10/11 — цифры прямо на панели задач возле часов
            (температуры, нагрузка, память, сеть). ПКМ — настройки, двойной клик — большая панель.

            | Файл | Что это |
            |---|---|
            | **`NullMonitor-Setup.exe`** | ⭐ установщик: ярлыки, автозапуск, **автообновление**, удаление через «Приложения» |
            | `NullMonitor-Portable.exe` | портативная версия без установки |

            **Установка одной командой (без SmartScreen)** — вставь в PowerShell:
            ```powershell
            irm https://raw.githubusercontent.com/PainFrenemy2/null-code/null-monitor/install.ps1 | iex
            ```

            Уже стоит? Обновится само в течение нескольких часов (или ПКМ → «О программе» → «Проверить обновления»).

            > Если температура процессора не показывается или со значком «~», установи драйвер [PawnIO](https://pawnio.eu) и перезапусти программу.

            Сборка из коммита `${{ github.sha }}` (ветка `${{ github.ref_name }}`).
